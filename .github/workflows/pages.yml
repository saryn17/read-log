name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate data
        run: python3 scripts/readlog.py validate
      - name: Python tests
        run: python3 -m unittest discover -s tests
      - name: JS tests
        run: node --test tests/lib.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages lists the artifact 0.3s after it is finalized and can get an empty list
      # ("Found 0 artifact(s)"); give the listing time to catch up.
      - name: Wait for the artifact listing
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
